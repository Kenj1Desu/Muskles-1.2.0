<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#04040a" />
  <title>Kenji Lifts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      background-color: #030308;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Liquid Morphing Aurora Background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 20%, #0d0826 0%, #030308 75%);
    }

    .morph-blob {
      position: absolute;
      filter: blur(55px);
      opacity: 0.75;
      mix-blend-mode: screen;
      will-change: transform, border-radius;
    }

    .blob-1 {
      width: 340px;
      height: 340px;
      background: linear-gradient(135deg, #c026d3 0%, #7e22ce 50%, #4f46e5 100%);
      top: 4%;
      right: -60px;
      animation: liquidMorph1 14s ease-in-out infinite alternate;
    }

    .blob-2 {
      width: 360px;
      height: 320px;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 60%, #9333ea 100%);
      top: 36%;
      left: -80px;
      animation: liquidMorph2 17s ease-in-out infinite alternate;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 60%, #06b6d4 100%);
      bottom: 8%;
      right: -40px;
      animation: liquidMorph1 19s ease-in-out infinite alternate-reverse;
    }

    @keyframes liquidMorph1 {
      0% {
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      50% {
        border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%;
        transform: translate(-45px, 50px) rotate(45deg) scale(1.12);
      }
      100% {
        border-radius: 35% 65% 31% 69% / 57% 59% 41% 43%;
        transform: translate(25px, -30px) rotate(90deg) scale(0.94);
      }
    }

    @keyframes liquidMorph2 {
      0% {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      50% {
        border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
        transform: translate(60px, -40px) rotate(-40deg) scale(1.15);
      }
      100% {
        border-radius: 55% 45% 65% 35% / 40% 65% 35% 60%;
        transform: translate(-20px, 45px) rotate(-80deg) scale(0.95);
      }
    }

    /* Authentic Mockup Frosted Glass Card */
    .glass-card {
      position: relative;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0.02) 100%
      );
      backdrop-filter: blur(28px) saturate(210%);
      -webkit-backdrop-filter: blur(28px) saturate(210%);
      border-top: 1px solid rgba(255, 255, 255, 0.34);
      border-left: 1px solid rgba(255, 255, 255, 0.24);
      border-right: 1px solid rgba(255, 255, 255, 0.09);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 20px 45px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 1px 0 rgba(255, 255, 255, 0.05);
      transition: transform 0.35s var(--spring), border-radius 0.35s var(--smooth), box-shadow 0.35s var(--smooth);
    }

    /* Recessed Frosted Wells (Inputs & Inner Boxes) */
    .glass-well {
      background: rgba(8, 8, 18, 0.42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s var(--smooth);
    }

    /* Floating Glass Dock & Topbar */
    .glass-bar {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
      backdrop-filter: blur(32px) saturate(220%);
      -webkit-backdrop-filter: blur(32px) saturate(220%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px rgba(255, 255, 255, 0.38);
    }

    /* Morphing Buttons & Steppers */
    .morph-btn {
      transition: transform 0.3s var(--spring), border-radius 0.3s var(--smooth), background 0.3s ease, box-shadow 0.3s ease;
    }
    .morph-btn:active {
      transform: scale(0.92);
      border-radius: 22px;
    }

    .stepper-btn {
      transition: transform 0.28s var(--spring), border-radius 0.28s var(--smooth), background 0.2s ease;
    }
    .stepper-btn:active {
      transform: scale(0.82);
      border-radius: 50%;
      background: linear-gradient(135deg, #c084fc, #22d3ee);
      color: #030308;
    }

    /* Tab & Set Entry Animations */
    .tab-pane {
      transition: opacity 0.35s var(--smooth), transform 0.38s var(--spring);
    }

    @keyframes setMorphIn {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.94);
        border-radius: 36px;
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        border-radius: 20px;
      }
    }
    .animate-set-in {
      animation: setMorphIn 0.42s var(--spring) forwards;
    }

    @keyframes overloadPulse {
      0%, 100% { box-shadow: 0 0 12px rgba(34, 211, 238, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.35); }
      50% { box-shadow: 0 0 24px rgba(192, 132, 252, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.5); }
    }
    .overload-glow {
      animation: overloadPulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="pb-32">

  <!-- Animated Liquid Aurora Backdrop -->
  <div class="aurora-bg">
    <div class="morph-blob blob-1"></div>
    <div class="morph-blob blob-2"></div>
    <div class="morph-blob blob-3"></div>
  </div>

  <!-- Sticky Frosted Header -->
  <header class="glass-bar sticky top-0 z-40 px-4 py-3.5 flex justify-between items-center border-t-0 border-x-0">
    <div class="flex items-center gap-3">
      <!-- Atomic Orbital Icon (From Mockup) -->
      <div class="w-10 h-10 rounded-2xl glass-card flex items-center justify-center shadow-lg">
        <svg class="w-6 h-6 text-white drop-shadow-[0_0_8px_rgba(34,211,238,0.8)] animate-[spin_24s_linear_infinite]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
          <ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(30 12 12)"/>
          <ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(-30 12 12)"/>
          <ellipse cx="12" cy="12" rx="9.5" ry="3.8" transform="rotate(90 12 12)"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-wider text-white drop-shadow-sm">KENJI LIFTS</h1>
        <p id="user-stats-banner" class="text-[10px] text-white/60 font-semibold tracking-widest uppercase">BW: -- kg</p>
      </div>
    </div>
    
    <!-- Stopwatch Pill -->
    <button onclick="toggleTimerModal()" id="timer-badge" class="morph-btn flex items-center gap-1.5 px-3.5 py-2 rounded-full glass-card text-[10px] font-extrabold text-cyan-200 tracking-widest">
      <svg class="w-3.5 h-3.5 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span id="timer-display">REST</span>
    </button>
  </header>

  <!-- Main Content -->
  <main class="p-4 max-w-md mx-auto space-y-4 relative z-10">

    <!-- TAB 1: WORKOUT LOGGING -->
    <section id="tab-log" class="space-y-4 tab-pane">
      
      <!-- Split Selector -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-white/60 uppercase tracking-widest block pl-1">Workout Split</label>
        <div class="grid grid-cols-2 gap-2.5" id="split-buttons"></div>
      </div>

      <!-- Exercise Dropdown -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-white/60 uppercase tracking-widest block pl-1">Selected Exercise</label>
        <div class="relative">
          <select id="exercise-select" onchange="renderExerciseDetails()" class="w-full appearance-none glass-card rounded-2xl px-4 py-3.5 text-sm font-bold text-white focus:outline-none pr-10"></select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-cyan-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <!-- Main Frosted Glass Mockup Card -->
      <div class="glass-card rounded-[28px] p-5 space-y-4">
        <div class="flex justify-between items-center">
          <span id="target-muscle-badge" class="text-[10px] font-extrabold px-3.5 py-1 rounded-full bg-white/15 text-white border border-white/25 tracking-widest uppercase shadow-sm">CHEST</span>
          <span id="lift-rating-badge" class="text-xs font-extrabold text-cyan-200 tracking-wide">Rating: --</span>
        </div>

        <div class="glass-well p-3.5 rounded-2xl text-[11px] leading-relaxed">
          <span class="text-white/50 font-bold tracking-widest uppercase block mb-1">Previous Session</span>
          <p id="prev-log-display" class="text-white/80 italic">No logged lifts for this exercise.</p>
        </div>

        <!-- Steppers -->
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-3.5">
            <div class="glass-well p-3 rounded-2xl space-y-1.5">
              <label class="text-[10px] font-bold text-white/60 block text-center uppercase tracking-widest">Weight (kg)</label>
              <div class="flex items-center justify-between">
                <button onclick="adjustInput('input-weight', -2.5)" class="stepper-btn w-9 h-9 rounded-xl glass-card text-white font-bold text-lg flex items-center justify-center">-</button>
                <input type="number" id="input-weight" placeholder="0" step="0.5" class="w-full bg-transparent text-center font-black text-xl text-white focus:outline-none" />
                <button onclick="adjustInput('input-weight', 2.5)" class="stepper-btn w-9 h-9 rounded-xl glass-card text-white font-bold text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <div class="glass-well p-3 rounded-2xl space-y-1.5">
              <label class="text-[10px] font-bold text-white/60 block text-center uppercase tracking-widest">Reps</label>
              <div class="flex items-center justify-between">
                <button onclick="adjustInput('input-reps', -1)" class="stepper-btn w-9 h-9 rounded-xl glass-card text-white font-bold text-lg flex items-center justify-center">-</button>
                <input type="number" id="input-reps" placeholder="0" class="w-full bg-transparent text-center font-black text-xl text-cyan-300 focus:outline-none" />
                <button onclick="adjustInput('input-reps', 1)" class="stepper-btn w-9 h-9 rounded-xl glass-card text-white font-bold text-lg flex items-center justify-center">+</button>
              </div>
            </div>
          </div>

          <!-- Frosted Gradient Log Button -->
          <button onclick="logCurrentSet()" class="morph-btn w-full bg-gradient-to-r from-purple-500/80 via-fuchsia-500/80 to-cyan-400/80 border border-white/35 text-white font-black py-4 rounded-2xl text-xs tracking-widest shadow-[0_10px_25px_rgba(168,85,247,0.35)] uppercase backdrop-blur-md">
            Log Set
          </button>
        </div>
      </div>

      <!-- Active Session Sets -->
      <div class="space-y-3 pt-1">
        <div class="flex justify-between items-center px-1">
          <span class="text-[10px] font-bold text-white/60 uppercase tracking-widest">Active Workout Sets</span>
          <span id="session-count" class="text-cyan-300 font-black text-xs">0 sets</span>
        </div>

        <div id="session-sets-list" class="space-y-2.5 text-xs"></div>

        <!-- Complete Workout Button -->
        <div id="finish-workout-container" class="pt-2 hidden">
          <button onclick="finishWorkoutSession()" class="morph-btn w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500/80 to-blue-600/80 border border-white/30 text-white font-black text-xs tracking-widest uppercase shadow-[0_10px_25px_rgba(6,182,212,0.3)] backdrop-blur-md">
            ✓ Complete & Save Workout
          </button>
        </div>
      </div>
    </section>

    <!-- TAB 2: HISTORY & PAST DAYS -->
    <section id="tab-history" class="space-y-4 hidden tab-pane">
      <div class="grid grid-cols-2 gap-2 glass-card p-1.5 rounded-2xl">
        <button onclick="switchHistorySubTab('workouts')" id="subtab-workouts-btn" class="morph-btn py-2.5 rounded-xl text-xs font-extrabold bg-white/20 text-white border border-white/25 shadow-sm">Past Workouts</button>
        <button onclick="switchHistorySubTab('overload')" id="subtab-overload-btn" class="morph-btn py-2.5 rounded-xl text-xs font-bold text-white/60">Exercise Progress</button>
      </div>

      <!-- Past Workouts Archive -->
      <div id="view-past-workouts" class="space-y-3">
        <div id="past-workouts-list" class="space-y-3"></div>
      </div>

      <!-- Progressive Overload View -->
      <div id="view-overload-timeline" class="space-y-4 hidden">
        <div class="relative">
          <select id="history-filter" onchange="renderHistory()" class="w-full appearance-none glass-card rounded-2xl px-4 py-3.5 text-xs font-bold text-white focus:outline-none pr-10"></select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-cyan-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
        <div id="history-timeline" class="space-y-3"></div>
      </div>
    </section>

    <!-- TAB 3: VOLUME ANALYTICS -->
    <section id="tab-analytics" class="space-y-4 hidden tab-pane">
      <h2 class="text-sm font-extrabold text-white uppercase tracking-widest pl-1">Volume & Distribution</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="glass-card p-4 rounded-3xl">
          <span class="text-white/60 text-[10px] font-bold uppercase tracking-wider block">Total Volume</span>
          <p id="stat-total-volume" class="text-lg font-black text-cyan-300 mt-1.5">0 kg</p>
        </div>
        <div class="glass-card p-4 rounded-3xl">
          <span class="text-white/60 text-[10px] font-bold uppercase tracking-wider block">Total Sets</span>
          <p id="stat-total-sets" class="text-lg font-black text-purple-200 mt-1.5">0</p>
        </div>
      </div>

      <div class="glass-card p-5 rounded-3xl space-y-4">
        <h3 class="text-[10px] font-bold text-white/60 uppercase tracking-widest pl-1">Primary Muscle Load</h3>
        <div id="muscle-breakdown" class="space-y-3.5"></div>
      </div>
    </section>

    <!-- TAB 4: PROFILE & BACKUP -->
    <section id="tab-profile" class="space-y-4 hidden tab-pane">
      <h2 class="text-sm font-extrabold text-white uppercase tracking-widest pl-1">Biometrics & Backups</h2>
      <div class="glass-card p-5 rounded-3xl space-y-4">
        <div>
          <label class="text-[10px] text-white/60 font-bold uppercase tracking-widest block mb-1.5">Body Weight (kg)</label>
          <input type="number" id="input-bw" placeholder="0" step="0.5" class="w-full glass-well rounded-2xl p-3.5 text-sm font-bold text-white focus:border-white/40 focus:outline-none" />
        </div>
        <div>
          <label class="text-[10px] text-white/60 font-bold uppercase tracking-widest block mb-1.5">Height (cm)</label>
          <input type="number" id="input-height" placeholder="0" class="w-full glass-well rounded-2xl p-3.5 text-sm font-bold text-white focus:border-white/40 focus:outline-none" />
        </div>
        <button onclick="saveUserProfile()" class="morph-btn w-full bg-gradient-to-r from-purple-500/80 to-cyan-500/80 border border-white/30 text-white font-black py-3.5 rounded-2xl text-xs tracking-widest uppercase shadow-lg">
          Update Biometrics
        </button>
      </div>

      <div class="glass-card p-5 rounded-3xl space-y-4">
        <h3 class="text-[10px] font-bold text-white/60 uppercase tracking-widest pl-1">Data Backup</h3>
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="exportData()" class="morph-btn glass-well hover:border-white/30 py-3 rounded-2xl text-xs font-bold text-white">Export JSON</button>
          <button onclick="document.getElementById('import-file').click()" class="morph-btn glass-well hover:border-white/30 py-3 rounded-2xl text-xs font-bold text-white">Import JSON</button>
          <input type="file" id="import-file" onchange="importData(event)" class="hidden" accept=".json" />
        </div>
      </div>
    </section>

  </main>

  <!-- Rest Stopwatch Modal -->
  <div id="timer-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xl z-50 flex items-end sm:items-center justify-center p-4 hidden">
    <div class="glass-card rounded-[32px] p-6 w-full max-w-xs text-center space-y-5 animate-set-in">
      <h3 class="text-[10px] font-bold text-white/60 uppercase tracking-widest">Recovery Countdown</h3>
      <div id="modal-timer-countdown" class="text-5xl font-black text-white drop-shadow-[0_0_15px_rgba(34,211,238,0.5)] tracking-wider">00:00</div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="startRestTimer(60)" class="morph-btn glass-well py-2.5 rounded-xl text-xs font-bold text-white">60s</button>
        <button onclick="startRestTimer(90)" class="morph-btn glass-well py-2.5 rounded-xl text-xs font-bold text-cyan-300 border-cyan-400/30">90s</button>
        <button onclick="startRestTimer(120)" class="morph-btn glass-well py-2.5 rounded-xl text-xs font-bold text-white">120s</button>
      </div>
      <button onclick="toggleTimerModal()" class="w-full py-2 text-xs font-extrabold text-white/50 hover:text-white uppercase tracking-widest">Dismiss</button>
    </div>
  </div>

  <!-- Floating Frosted Glass Navigation Dock -->
  <nav class="fixed bottom-4 left-4 right-4 max-w-md mx-auto glass-bar rounded-[28px] p-2 z-40 flex justify-around items-center">
    <button onclick="switchTab('log')" id="nav-log" class="morph-btn flex flex-col items-center gap-1 text-white bg-white/15 border border-white/25 rounded-2xl py-1.5 px-4 shadow-sm">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M12 4v16m8-8H4"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Log</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="morph-btn flex flex-col items-center gap-1 text-white/50 py-1.5 px-4 rounded-2xl border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">History</span>
    </button>
    <button onclick="switchTab('analytics')" id="nav-analytics" class="morph-btn flex flex-col items-center gap-1 text-white/50 py-1.5 px-4 rounded-2xl border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Volume</span>
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="morph-btn flex flex-col items-center gap-1 text-white/50 py-1.5 px-4 rounded-2xl border border-transparent">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-wider">Profile</span>
    </button>
  </nav>

  <script>
    const ROUTINES = {
      "Push": [
        { name: "Incline DB. Press", muscle: "Upper Chest" },
        { name: "Cable Lat Raise", muscle: "Side Delts" },
        { name: "Machine Press (CL)", muscle: "Chest" },
        { name: "Overhead Tri. Ext. Bar", muscle: "Triceps" },
        { name: "Tri. Pushdown Bar", muscle: "Triceps" },
        { name: "Pec Fly (Upper/Lower)", muscle: "Chest" }
      ],
      "Pull": [
        { name: "Machine Pullovers", muscle: "Lats" },
        { name: "Wide Grip Row", muscle: "Upper Back" },
        { name: "Close grip Machine row", muscle: "Lats" },
        { name: "Cable Rear delt flys", muscle: "Rear Delts" },
        { name: "Shrugs", muscle: "Traps" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Hammer/Preacher Curl", muscle: "Biceps" }
      ],
      "Legs": [
        { name: "Hack Squat", muscle: "Quads" },
        { name: "Seated Hamstring Curl", muscle: "Hamstrings" },
        { name: "Leg Extension", muscle: "Quads" },
        { name: "Hip Adductor", muscle: "Adductors" },
        { name: "Hip Thrust", muscle: "Glutes" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Standing Calf Raise", muscle: "Calves" }
      ],
      "Arm-Shoulder": [
        { name: "Machine Shoulder Press", muscle: "Front Delts" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Cable Lateral Raise", muscle: "Side Delts" },
        { name: "Overhead Triceps Extension", muscle: "Triceps" },
        { name: "Preacher Curl", muscle: "Biceps" },
        { name: "Triceps Pushdown", muscle: "Triceps" }
      ]
    };

    let currentSplit = "Push";
    let logs = JSON.parse(localStorage.getItem("iron_logs") || "[]");
    let activeSessionSets = JSON.parse(localStorage.getItem("iron_active_session") || "[]");
    let userProfile = JSON.parse(localStorage.getItem("iron_profile") || '{"weight": 70, "height": 175}');
    let restTimerInterval = null;
    let restTimeRemaining = 0;

    function init() {
      renderSplitButtons();
      populateExerciseSelect();
      updateProfileDisplay();
      renderExerciseDetails();
      renderActiveSession();
      populateHistoryFilter();
    }

    function switchTab(tabId) {
      ['log', 'history', 'analytics', 'profile'].forEach(t => {
        const pane = document.getElementById(`tab-${t}`);
        pane.classList.add('hidden');
        pane.style.opacity = '0';
        pane.style.transform = 'translateY(12px) scale(0.97)';
        const navEl = document.getElementById(`nav-${t}`);
        navEl.className = "morph-btn flex flex-col items-center gap-1 text-white/50 py-1.5 px-4 rounded-2xl border border-transparent";
      });
      
      const activePane = document.getElementById(`tab-${tabId}`);
      activePane.classList.remove('hidden');
      setTimeout(() => {
        activePane.style.opacity = '1';
        activePane.style.transform = 'translateY(0) scale(1)';
      }, 30);

      const activeNav = document.getElementById(`nav-${tabId}`);
      activeNav.className = "morph-btn flex flex-col items-center gap-1 text-white bg-white/15 border border-white/25 rounded-2xl py-1.5 px-4 shadow-sm scale-105";

      if (tabId === 'history') {
        renderPastWorkouts();
        renderHistory();
      }
      if (tabId === 'analytics') renderAnalytics();
      if (tabId === 'log') {
        renderExerciseDetails();
        renderActiveSession();
      }
    }

    function renderSplitButtons() {
      const container = document.getElementById('split-buttons');
      container.innerHTML = Object.keys(ROUTINES).map(split => `
        <button onclick="setSplit('${split}')" class="morph-btn py-3 px-3 text-xs font-extrabold rounded-2xl transition-all ${
          currentSplit === split 
            ? 'glass-card text-white border-white/45 shadow-[0_0_20px_rgba(168,85,247,0.3)] scale-[1.02]' 
            : 'glass-well text-white/55 hover:text-white'
        }">${split}</button>
      `).join('');
    }

    function setSplit(split) {
      currentSplit = split;
      renderSplitButtons();
      populateExerciseSelect();
      renderExerciseDetails();
    }

    function populateExerciseSelect() {
      const select = document.getElementById('exercise-select');
      const exercises = ROUTINES[currentSplit];
      select.innerHTML = exercises.map(ex => `<option value="${ex.name}" class="bg-[#0b0914] text-white">${ex.name}</option>`).join('');
    }

    function getSelectedExerciseObj() {
      const exName = document.getElementById('exercise-select').value;
      for (const split in ROUTINES) {
        const found = ROUTINES[split].find(e => e.name === exName);
        if (found) return found;
      }
      return { name: exName, muscle: "Other" };
    }

    function renderExerciseDetails() {
      const ex = getSelectedExerciseObj();
      document.getElementById('target-muscle-badge').innerText = ex.muscle;

      const allSets = [...logs, ...activeSessionSets];
      const exerciseLogs = allSets.filter(l => l.exercise === ex.name);
      const prevDisplay = document.getElementById('prev-log-display');
      const ratingBadge = document.getElementById('lift-rating-badge');

      if (exerciseLogs.length === 0) {
        prevDisplay.innerHTML = `<span class="text-white/40 italic">No logged lifts for this exercise.</span>`;
        ratingBadge.innerText = "Rating: --";
        return;
      }

      const latestDate = exerciseLogs[exerciseLogs.length - 1].date;
      const latestSessionSets = exerciseLogs.filter(l => l.date === latestDate);
      prevDisplay.innerHTML = `<span class="text-cyan-300 font-bold">${latestDate}:</span> ` + latestSessionSets.map((s, i) => `S${i+1}: <strong>${s.weight}kg × ${s.reps}</strong>`).join(', ');

      let maxE1RM = 0;
      exerciseLogs.forEach(s => {
        const e1rm = s.weight * (1 + s.reps / 30);
        if (e1rm > maxE1RM) maxE1RM = e1rm;
      });

      const bw = userProfile.weight || 70;
      const ratio = (maxE1RM / bw).toFixed(2);
      let tier = "Beginner";
      if (ratio >= 1.5) tier = "Advanced";
      else if (ratio >= 1.1) tier = "Intermediate";
      else if (ratio >= 0.75) tier = "Novice";

      ratingBadge.innerText = `Rating: ${tier} (${ratio}x BW)`;
    }

    function adjustInput(id, delta) {
      const el = document.getElementById(id);
      let val = parseFloat(el.value) || 0;
      val = Math.max(0, val + delta);
      el.value = (val % 1 !== 0) ? val.toFixed(1) : val;
    }

    function logCurrentSet() {
      const weight = parseFloat(document.getElementById('input-weight').value);
      const reps = parseInt(document.getElementById('input-reps').value, 10);
      const ex = getSelectedExerciseObj();

      if (isNaN(weight) || isNaN(reps) || reps <= 0) {
        alert("Please enter a valid weight and reps count.");
        return;
      }

      const now = new Date();
      const today = now.toISOString().split('T')[0];
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const entry = {
        id: Date.now() + Math.random(),
        date: today,
        time: timeStr,
        split: currentSplit,
        exercise: ex.name,
        muscle: ex.muscle,
        weight: weight,
        reps: reps,
        volume: weight * reps
      };

      activeSessionSets.push(entry);
      localStorage.setItem("iron_active_session", JSON.stringify(activeSessionSets));

      document.getElementById('input-reps').value = '';
      renderExerciseDetails();
      renderActiveSession();
      startRestTimer(90);
    }

    function renderActiveSession() {
      const list = document.getElementById('session-sets-list');
      const finishBtnContainer = document.getElementById('finish-workout-container');
      document.getElementById('session-count').innerText = `${activeSessionSets.length} sets`;

      if (activeSessionSets.length === 0) {
        list.innerHTML = `<p class="text-white/40 italic text-center py-2.5">No active sets right now. Start logging above!</p>`;
        finishBtnContainer.classList.add('hidden');
        return;
      }

      finishBtnContainer.classList.remove('hidden');

      list.innerHTML = activeSessionSets.slice().reverse().map(s => `
        <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center animate-set-in">
          <div>
            <div class="font-extrabold text-white text-xs">${s.exercise}</div>
            <div class="text-[9px] text-cyan-200 font-bold tracking-wider uppercase">${s.muscle} • ${s.split}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <span class="font-black text-sm text-white">${s.weight} kg × ${s.reps}</span>
              <span class="text-white/50 text-[9px] block font-bold uppercase tracking-wide">${s.volume.toLocaleString()} kg vol</span>
            </div>
            <button onclick="deleteActiveSet(${s.id})" class="morph-btn text-rose-300 hover:text-rose-200 p-2 rounded-xl glass-well">
              <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function deleteActiveSet(setId) {
      activeSessionSets = activeSessionSets.filter(s => s.id !== setId);
      localStorage.setItem("iron_active_session", JSON.stringify(activeSessionSets));
      renderActiveSession();
      renderExerciseDetails();
    }

    function finishWorkoutSession() {
      if (activeSessionSets.length === 0) return;

      const totalVol = activeSessionSets.reduce((acc, s) => acc + s.volume, 0);
      const confirmMsg = `Complete workout?\n• ${activeSessionSets.length} Sets Logged\n• ${totalVol.toLocaleString()} kg Total Volume`;
      if (!confirm(confirmMsg)) return;

      logs = [...logs, ...activeSessionSets];
      localStorage.setItem("iron_logs", JSON.stringify(logs));

      activeSessionSets = [];
      localStorage.removeItem("iron_active_session");

      renderActiveSession();
      renderExerciseDetails();
      alert("Workout Completed & Saved to History!");
    }

    function switchHistorySubTab(tab) {
      const workoutsBtn = document.getElementById('subtab-workouts-btn');
      const overloadBtn = document.getElementById('subtab-overload-btn');
      const workoutsView = document.getElementById('view-past-workouts');
      const overloadView = document.getElementById('view-overload-timeline');

      if (tab === 'workouts') {
        workoutsBtn.className = "morph-btn py-2.5 rounded-xl text-xs font-extrabold bg-white/20 text-white border border-white/25 shadow-sm";
        overloadBtn.className = "morph-btn py-2.5 rounded-xl text-xs font-bold text-white/60";
        workoutsView.classList.remove('hidden');
        overloadView.classList.add('hidden');
        renderPastWorkouts();
      } else {
        overloadBtn.className = "morph-btn py-2.5 rounded-xl text-xs font-extrabold bg-white/20 text-white border border-white/25 shadow-sm";
        workoutsBtn.className = "morph-btn py-2.5 rounded-xl text-xs font-bold text-white/60";
        overloadView.classList.remove('hidden');
        workoutsView.classList.add('hidden');
        renderHistory();
      }
    }

    function renderPastWorkouts() {
      const container = document.getElementById('past-workouts-list');
      if (logs.length === 0) {
        container.innerHTML = `<p class="text-xs text-white/50 py-6 text-center">No completed workouts yet. Log and hit "Complete Workout" to see them here.</p>`;
        return;
      }

      const sessionsByDate = {};
      logs.forEach(s => {
        if (!sessionsByDate[s.date]) sessionsByDate[s.date] = [];
        sessionsByDate[s.date].push(s);
      });

      const dates = Object.keys(sessionsByDate).sort().reverse();

      container.innerHTML = dates.map(date => {
        const sets = sessionsByDate[date];
        const dayVol = sets.reduce((acc, s) => acc + s.volume, 0);
        const splitTag = sets[0].split || "Routine";

        return `
          <div class="glass-card rounded-3xl p-4 space-y-3 animate-set-in">
            <div class="flex justify-between items-center cursor-pointer" onclick="toggleSessionExpand('${date}')">
              <div>
                <span class="text-xs font-black text-white">${date}</span>
                <span class="text-[9px] font-bold text-cyan-200 uppercase px-2.5 py-0.5 rounded-full bg-white/10 ml-1.5 border border-white/20">${splitTag}</span>
              </div>
              <div class="text-right">
                <span class="text-xs font-extrabold text-cyan-300">${dayVol.toLocaleString()} kg</span>
                <span class="text-[10px] text-white/60 block font-semibold">${sets.length} sets ▾</span>
              </div>
            </div>

            <div id="session-detail-${date}" class="space-y-2 pt-2 border-t border-white/10">
              ${sets.map((s) => `
                <div class="flex justify-between items-center glass-well px-3 py-2 rounded-2xl text-xs">
                  <div>
                    <span class="font-bold text-white block">${s.exercise}</span>
                    <span class="text-[9px] text-white/50 font-semibold uppercase">${s.muscle}</span>
                  </div>
                  <div class="flex items-center gap-2.5">
                    <span class="font-black text-cyan-200">${s.weight} kg × ${s.reps}</span>
                    <button onclick="deleteArchivedSet(${s.id})" class="text-rose-300 hover:text-rose-200 p-1 rounded-lg bg-rose-500/20 border border-rose-400/30">
                      <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                      </svg>
                    </button>
                  </div>
                </div>
              `).join('')}
              <div class="pt-1 flex justify-end">
                <button onclick="deleteEntireDay('${date}')" class="text-[10px] text-rose-300 font-bold uppercase tracking-wider py-1 px-2.5 rounded-lg border border-rose-400/30 hover:bg-rose-500/20">
                  Delete Session
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleSessionExpand(date) {
      const el = document.getElementById(`session-detail-${date}`);
      if (el) el.classList.toggle('hidden');
    }

    function deleteArchivedSet(setId) {
      if (!confirm("Delete this set from history?")) return;
      logs = logs.filter(l => l.id !== setId);
      localStorage.setItem("iron_logs", JSON.stringify(logs));
      renderPastWorkouts();
      renderHistory();
      renderAnalytics();
      renderExerciseDetails();
    }

    function deleteEntireDay(date) {
      if (!confirm(`Delete all workout logs for ${date}?`)) return;
      logs = logs.filter(l => l.date !== date);
      localStorage.setItem("iron_logs", JSON.stringify(logs));
      renderPastWorkouts();
      renderHistory();
      renderAnalytics();
      renderExerciseDetails();
    }

    function populateHistoryFilter() {
      const select = document.getElementById('history-filter');
      const allExercises = [];
      Object.values(ROUTINES).forEach(list => list.forEach(item => {
        if (!allExercises.includes(item.name)) allExercises.push(item.name);
      }));
      select.innerHTML = allExercises.map(e => `<option value="${e}" class="bg-[#0b0914] text-white">${e}</option>`).join('');
    }

    function renderHistory() {
      const selected = document.getElementById('history-filter').value;
      const historyList = logs.filter(l => l.exercise === selected);
      const container = document.getElementById('history-timeline');

      if (historyList.length === 0) {
        container.innerHTML = `<p class="text-xs text-white/50 py-4 text-center">No logs found for ${selected}.</p>`;
        return;
      }

      const grouped = {};
      historyList.forEach(s => {
        if (!grouped[s.date]) grouped[s.date] = [];
        grouped[s.date].push(s);
      });

      const dates = Object.keys(grouped).sort();
      let html = '';
      let prevBest1RM = 0;

      dates.forEach(d => {
        const sets = grouped[d];
        const dayVol = sets.reduce((acc, s) => acc + s.volume, 0);
        const dayMax1RM = Math.max(...sets.map(s => s.weight * (1 + s.reps / 30)));

        let overloadNotice = '';
        let glowClass = '';
        if (prevBest1RM > 0) {
          if (dayMax1RM > prevBest1RM) {
            overloadNotice = `<span class="text-cyan-200 font-black tracking-widest text-[9px] bg-white/15 px-2.5 py-0.5 rounded-full border border-white/30 ml-1.5 uppercase">▲ OVERLOAD</span>`;
            glowClass = 'overload-glow';
          } else if (dayMax1RM < prevBest1RM) {
            overloadNotice = `<span class="text-rose-300 font-bold text-[9px] ml-1.5">▼ Drop</span>`;
          }
        }
        prevBest1RM = dayMax1RM;

        html += `
          <div class="glass-card p-4 rounded-3xl space-y-2 animate-set-in ${glowClass}">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
              <span class="font-extrabold text-white text-xs">${d} ${overloadNotice}</span>
              <span class="text-cyan-300 font-extrabold text-xs">${dayVol.toLocaleString()} kg</span>
            </div>
            <div class="space-y-1.5 pt-0.5">
              ${sets.map((s, idx) => `
                <div class="flex justify-between items-center glass-well px-3 py-1.5 rounded-xl text-xs">
                  <span class="text-white/80">Set ${idx+1}: <strong class="text-white">${s.weight}kg × ${s.reps}</strong></span>
                  <span class="text-white/50 text-[10px] font-bold">${s.volume} kg vol</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderAnalytics() {
      const allSets = [...logs, ...activeSessionSets];
      const totalVol = allSets.reduce((acc, s) => acc + s.volume, 0);
      document.getElementById('stat-total-volume').innerText = `${totalVol.toLocaleString()} kg`;
      document.getElementById('stat-total-sets').innerText = allSets.length;

      const muscleVol = {};
      allSets.forEach(s => {
        muscleVol[s.muscle] = (muscleVol[s.muscle] || 0) + s.volume;
      });

      const sortedMuscles = Object.entries(muscleVol).sort((a, b) => b[1] - a[1]);
      const breakdownEl = document.getElementById('muscle-breakdown');

      if (sortedMuscles.length === 0) {
        breakdownEl.innerHTML = `<p class="text-xs text-white/50 py-4 text-center">Log workouts to see distribution.</p>`;
        return;
      }

      const maxMVol = sortedMuscles[0][1] || 1;
      breakdownEl.innerHTML = sortedMuscles.map(([muscle, vol]) => {
        const pct = Math.round((vol / maxMVol) * 100);
        return `
          <div class="space-y-2">
            <div class="flex justify-between text-xs items-center">
              <span class="font-bold text-white">${muscle}</span>
              <span class="text-cyan-200 font-bold">${vol.toLocaleString()} kg</span>
            </div>
            <div class="w-full glass-well rounded-full h-2.5 overflow-hidden p-[1.5px]">
              <div class="bg-gradient-to-r from-purple-400 via-fuchsia-400 to-cyan-300 h-full rounded-full transition-all duration-700" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Stopwatch Functions */
    function toggleTimerModal() {
      document.getElementById('timer-modal').classList.toggle('hidden');
    }

    function startRestTimer(seconds) {
      clearInterval(restTimerInterval);
      restTimeRemaining = seconds;
      updateTimerDisplay();
      document.getElementById('timer-modal').classList.add('hidden');

      restTimerInterval = setInterval(() => {
        restTimeRemaining--;
        updateTimerDisplay();
        if (restTimeRemaining <= 0) {
          clearInterval(restTimerInterval);
          document.getElementById('timer-display').innerText = "DONE";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(restTimeRemaining / 60);
      const s = restTimeRemaining % 60;
      const str = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      document.getElementById('timer-display').innerText = str;
      document.getElementById('modal-timer-countdown').innerText = str;
    }

    /* Backup / Restore */
    function exportData() {
      const blob = new Blob([JSON.stringify({ logs, activeSessionSets, userProfile })], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `KenjiLifts_Backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.logs) logs = data.logs;
          if (data.activeSessionSets) activeSessionSets = data.activeSessionSets;
          if (data.userProfile) userProfile = data.userProfile;
          localStorage.setItem("iron_logs", JSON.stringify(logs));
          localStorage.setItem("iron_active_session", JSON.stringify(activeSessionSets));
          localStorage.setItem("iron_profile", JSON.stringify(userProfile));
          init();
          alert("Backup restored!");
        } catch (err) {
          alert("Invalid backup file.");
        }
      };
      reader.readAsText(file);
    }

    function saveUserProfile() {
      const w = parseFloat(document.getElementById('input-bw').value);
      const h = parseFloat(document.getElementById('input-height').value);
      if (w) userProfile.weight = w;
      if (h) userProfile.height = h;
      localStorage.setItem("iron_profile", JSON.stringify(userProfile));
      updateProfileDisplay();
      renderExerciseDetails();
      alert("Biometrics Updated!");
    }

    function updateProfileDisplay() {
      document.getElementById('user-stats-banner').innerText = `BW: ${userProfile.weight || '--'} kg | Ht: ${userProfile.height || '--'} cm`;
      document.getElementById('input-bw').value = userProfile.weight || '';
      document.getElementById('input-height').value = userProfile.height || '';
    }

    window.onload = init;
  </script>
</body>
</html>
